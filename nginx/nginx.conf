events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:5173;
    }

    upstream core {
        server core:8000;
    }

    server {
        listen 80;
        server_name proxi.audista.com;

        # Redirect HTTP to HTTPS (uncomment after SSL setup)
        # return 301 https://$server_name$request_uri;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # CORS for mobile app (Capacitor uses http://localhost origin)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # For streaming responses
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # WebSocket support for Gemini Live
        location /ws {
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }

    # HTTPS server (uncomment after certbot setup)
    # server {
    #     listen 443 ssl http2;
    #     server_name proxi.audista.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/proxi.audista.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/proxi.audista.com/privkey.pem;
    #
    #     # Same location blocks as above
    # }
}
