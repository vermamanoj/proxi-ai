<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <title>Proxi | Headless Operator</title>
    
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        background-color: #0a0a0a;
        color: #e0e0e0;
        font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbar but allow scroll */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Thin scrollbar for desktop */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
      /* Safe area padding utility */
      .pb-safe { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
      /* Prevent overscroll bounce on iOS */
      body { overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state shown while JS bundles load -->
      <div id="initial-loader" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" style="animation: pulse 1.5s ease-in-out infinite;">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <p style="color: #888; font-size: 14px;">Loading Proxi...</p>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
