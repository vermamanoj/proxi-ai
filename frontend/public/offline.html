<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxi - Offline</title>
  <style>
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'SF Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container { padding: 2rem; }
    h1 { color: #00f0ff; font-size: 1.5rem; }
    p { color: #888; margin-top: 1rem; }
    button {
      margin-top: 2rem;
      background: #00f0ff;
      color: #0a0a0a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 Offline</h1>
    <p>Proxi requires an internet connection to communicate with the AI backend.</p>
    <button onclick="location.reload()">Retry Connection</button>
  </div>
</body>
</html>
