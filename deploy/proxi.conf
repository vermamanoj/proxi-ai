# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name proxi.audista.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name proxi.audista.com; 

    # Reuse Cloudflare Origin Certificate (Assuming wildcard *.audista.com)
    ssl_certificate     /etc/ssl/cloudflare/aiwargames.pem;
    ssl_certificate_key /etc/ssl/cloudflare/aiwargames.key;

    # SSL Settings (Modern & Secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Frontend (Vite HMR + WebSockets)
    # Proxies to Docker container exposed on port 4001
    location / {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend (API)
    # Proxies to Docker container exposed on port 4000
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
