# ============================================================
# Proxi Production Nginx Config
# Last Updated: Jan 29, 2026
# ============================================================

# Rate Limiting Zones (backup to Cloudflare - defense in depth)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name proxi.audista.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name proxi.audista.com; 

    # Reuse Cloudflare Origin Certificate (wildcard *.audista.com)
    ssl_certificate     /etc/ssl/cloudflare/aiwargames.pem;
    ssl_certificate_key /etc/ssl/cloudflare/aiwargames.key;

    # SSL Settings (Modern & Secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ============================================================
    # Security Headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;

    # ============================================================
    # Block Sensitive Endpoints
    # ============================================================
    
    # Block FastAPI docs (Swagger/OpenAPI)
    location /docs {
        deny all;
        return 404;
    }
    location /redoc {
        deny all;
        return 404;
    }
    location /openapi.json {
        deny all;
        return 404;
    }

    # ============================================================
    # API Endpoints with Rate Limiting
    # ============================================================

    # Login - strict rate limit (5 per minute per IP)
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://localhost:4000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General API - moderate rate limit
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Longer timeout for streaming responses (chat)
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ============================================================
    # Frontend
    # ============================================================
    
    # Frontend (React app + WebSockets for HMR in dev)
    location / {
        proxy_pass http://localhost:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
