version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: proxi-backend:latest
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      - "4000:8000"
    env_file:
      - .env

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume to prevent host sync issues
    ports:
      - "4001:5173"
    depends_on:
      - backend
