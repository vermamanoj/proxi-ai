# version: '3.8'

services:
  # Proxi Core - Orchestrator (auth, sessions, LLM, registry)
  core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: proxi-core:latest
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
      - ./data:/app/data  # Persist SQLite database across rebuilds
      # Note: auth data persists via ./backend/auth (already mounted above)
    ports:
      - "4000:8000"
    env_file:
      - .env
    environment:
      - PROXI_DEV_MODE=${PROXI_DEV_MODE:-false}  # Set true to skip approvals (demos/sandbox)
    restart: unless-stopped

  # Proxi Agent - Isolated desktop automation (no DB, no API keys)
  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    image: proxi-agent:latest
    ports:
      - "4001:8081"
    environment:
      - PROXI_AGENT_KEY=${PROXI_AGENT_KEY}  # Shared secret for Core auth
    restart: unless-stopped

  # SOC Forensics Container - Simulated compromised server for training
  forensic-investigation:
    build:
      context: ./soc-forensics
      dockerfile: Dockerfile
    image: proxi-forensics:v2
    ports:
      - "5081:8081"
    environment:
      - PROXI_AGENT_KEY=${PROXI_AGENT_KEY}
    restart: unless-stopped

  # Frontend UI
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GEMINI_API_KEY=${GEMINI_API_KEY}  # Pass to build for voice mode
    ports:
      - "4002:5173"
    environment:
      - VITE_API_URL=http://core:8000  # Docker internal networking
    depends_on:
      - core
    restart: unless-stopped

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL certs (after certbot)
    depends_on:
      - frontend
      - core
    restart: unless-stopped
    profiles:
      - production  # Only start with: docker-compose --profile production up
