version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: proxi-backend:latest
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      - "4000:8000"
    env_file:
      - .env
    environment:
      - RUNTIME_MODE=${RUNTIME_MODE:-DEMO}
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4001:5173"
    depends_on:
      - backend
    restart: unless-stopped
