version: '3.8'

services:
  # Proxi Core - Orchestrator (auth, sessions, LLM, registry)
  core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: proxi-core:latest
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      - "4000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Proxi Agent - Isolated desktop automation (no DB, no API keys)
  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    image: proxi-agent:latest
    ports:
      - "4001:8081"
    restart: unless-stopped

  # Frontend UI
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/../.env:ro
    ports:
      - "4002:5173"
    env_file:
      - .env
    depends_on:
      - core
    restart: unless-stopped
